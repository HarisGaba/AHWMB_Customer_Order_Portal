<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#073d25" />
    <meta name="description" content="AHWMB – Adam Haji Wali Muhammad & Brothers. Simple grocery ordering portal." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AHWMB · Customer Order Portal</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-title" content="AHWMB" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      body { background: #073d25; }

      #ahwmb-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #073d25;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 400ms ease, visibility 400ms ease;
      }

      #ahwmb-splash.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-inner {
        text-align: center;
        padding: 32px;
      }

      .splash-crest {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 110px; height: 110px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #e4aa2a, #f4c542);
        border-radius: 22px;
        border: 3px solid #fad97a;
        box-shadow: 0 8px 32px rgba(0,0,0,.35);
      }

      .splash-crest { border-radius:50%; border:0; overflow:hidden; background:transparent; }
      .splash-urdu {
        font-family: 'Noto Naskh Arabic', serif;
        font-size: 22px;
        font-weight: 900;
        color: #052318;
        line-height: 1;
      }

      .splash-brand {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: .1em;
        color: #073d25;
        line-height: 1.2;
      }

      .splash-year {
        font-family: system-ui, sans-serif;
        font-size: 10px;
        font-weight: 700;
        color: #0a5533;
        letter-spacing: .06em;
        line-height: 1;
      }

      .splash-company {
        font-family: system-ui, sans-serif;
        font-size: 20px;
        font-weight: 800;
        color: #ffffff;
        line-height: 1.3;
        margin-bottom: 28px;
      }

      .splash-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .splash-dots span {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: #e4aa2a;
        animation: splash-dot 1.2s ease-in-out infinite;
      }

      .splash-dots span:nth-child(2) { animation-delay: .2s; }
      .splash-dots span:nth-child(3) { animation-delay: .4s; }

      @keyframes splash-dot {
        0%, 80%, 100% { transform: scale(0.6); opacity: .4; }
        40% { transform: scale(1); opacity: 1; }
      }

      .splash-sub {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: #b8f0d4;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="ahwmb-splash">
      <div class="splash-inner">
        <div class="splash-crest">
          <img src="/logo.png" alt="AHWMB Logo" style="width:100%;height:100%;object-fit:cover;border-radius:50%" />
        </div>
        <p class="splash-company">
          Adam Haji Wali Muhammad<br>&amp; Brothers
        </p>
        <div class="splash-dots">
          <span></span><span></span><span></span>
        </div>
        <p class="splash-sub">Jodia Bazaar, Karachi</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
